services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tractor_usage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tractor_usage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
